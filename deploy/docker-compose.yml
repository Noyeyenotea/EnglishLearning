# ============================================
# Docker Compose - 生产环境部署
# ============================================

services:
  # ---------- PostgreSQL 数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: english-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: english
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe123!}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - english-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- 前端 Nginx ----------
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_MINIO_ENDPOINT: ${VITE_MINIO_ENDPOINT:-http://47.103.125.49:9000}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://47.103.125.49:3000}
    container_name: english-web
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - english-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- NestJS 服务端 ----------
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    container_name: english-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-ChangeMe123!}@postgres:5432/english
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    env_file:
      - deploy/.env.production
    ports:
      - "3000:3000"
    networks:
      - english-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/course"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: english-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - english-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- MinIO 对象存储 ----------
  # 用于存储用户头像、课程封面图片等文件
  minio:
    image: minio/minio:latest
    container_name: english-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMe123!}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API 端口
      - "9001:9001"   # Console 管理端口
    networks:
      - english-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------- MinIO 初始化 ----------
  # 首次启动时创建存储桶和策略
  minio-init:
    image: minio/mc:latest
    container_name: english-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - english-network
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc anonymous set download local/avatar;
      mc anonymous set download local/course;
      mc anonymous set download local/public;
      echo 'MinIO buckets configured successfully';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMe123!}

# ============================================
# 网络配置
# ============================================
networks:
  english-network:
    driver: bridge

# ============================================
# 数据卷
# ============================================
volumes:
  postgres_data:
  redis_data:
  minio_data:
