packages:
  - "apps/*"
  - "server"
  - "packages/*"

# pnpm 11+ 用 allowBuilds 替代旧的 onlyBuiltDependencies
# 值必须是 true 或 false，不能是占位符文本
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@nestjs/core': true
  esbuild: false
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
